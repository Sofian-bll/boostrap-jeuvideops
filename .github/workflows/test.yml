name: Test Workflow

on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

#  # Runs on pushes targeting "main" branche
#  push:
#    branches: [ 'main' ]

jobs:
  my_first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 16.13.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Hello World
        run: echo "Hello Github Actions!"

      - name: List files
        run: ls -la

  my_second_job:
    runs-on: ubuntu-latest
    steps:
      - name: List files
        run: ls -la

      - name: Generate coverage code report
        run: npm run nyc:run
